name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "^12.0"
            testbench: "^10.0"
          - laravel: "^13.0"
            testbench: "^11.0"

    name: Laravel ${{ matrix.laravel }} / PHP 8.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: >-
          composer update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          --with-all-dependencies
          --prefer-dist
          --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
